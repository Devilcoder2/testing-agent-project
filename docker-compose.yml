services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data

  qa-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qa_admin
      POSTGRES_PASSWORD: qa-admin-development-only
      POSTGRES_DB: qa_fixture
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_admin -d qa_fixture"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./qa-fixture/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - sentinel-qa-postgres:/var/lib/postgresql/data

  qa-fixture:
    build:
      context: .
      dockerfile: qa-fixture/Dockerfile
    depends_on:
      qa-postgres:
        condition: service_healthy
    environment:
      QA_FIXTURE_DATABASE_URL: postgresql://qa_fixture_writer:qa-fixture-writer-development-only@qa-postgres:5432/qa_fixture
      QA_FIXTURE_PORT: "8081"
    command: npx tsx qa-fixture/server.ts

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sentinel-redis:/data

  demo-target:
    build: ./demo-target
    ports:
      - "127.0.0.1:8080:80"

  browser:
    build: ./browser
    shm_size: 2gb
    environment:
      SE_VNC_NO_PASSWORD: "true"
      SE_NODE_SESSION_TIMEOUT: "1800"
    ports:
      - "127.0.0.1:7900:7900"

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinel-minio
      MINIO_ROOT_PASSWORD: sentinel-minio-development-only
    volumes:
      - sentinel-minio:/data
    ports:
      - "127.0.0.1:9000:9000"

  mailpit:
    image: axllent/mailpit:v1.30.4
    ports:
      - "127.0.0.1:8025:8025"

  sentinel:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      demo-target:
        condition: service_started
      browser:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      qa-postgres:
        condition: service_healthy
      qa-fixture:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel?schema=public
      SESSION_SECRET: sentinel-phase-1-development-secret
      DEMO_TARGET_URL: http://demo-target
      BROWSER_SELENIUM_URL: http://browser:4444/wd/hub
      BROWSER_VIEWER_URL: http://localhost:7900/?autoconnect=true&resize=scale&view_only=false
      RECORDER_ORIGIN: http://demo-target
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: sentinel-minio
      MINIO_SECRET_KEY: sentinel-minio-development-only
      MINIO_BUCKET: sentinel-evidence
      MINIO_REGION: us-east-1
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: Sentinel <noreply@sentinel.local>
      SENTINEL_APP_URL: http://localhost:3001
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Sentinel Demo}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-ava.tester@example.test}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-sentinel-dev}
      JIRA_CLOUD_URL: ${JIRA_CLOUD_URL:-}
      JIRA_SERVICE_EMAIL: ${JIRA_SERVICE_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      QA_DATABASE_URL: postgresql://qa_diagnostic:qa-diagnostic-read-only-development-only@qa-postgres:5432/qa_fixture
      EVIDENCE_RETENTION_DAYS: "30"
      GUIDED_RUN_DEMO_PASSWORD: ${GUIDED_RUN_DEMO_PASSWORD:?Set GUIDED_RUN_DEMO_PASSWORD in an untracked .env file}
      VARIABLE_ENCRYPTION_KEY: ${VARIABLE_ENCRYPTION_KEY:?Set VARIABLE_ENCRYPTION_KEY in an untracked .env file}
    command: sh -c "npm ci --ignore-scripts && npm run db:generate && npm run db:migrate && npm run db:seed && npm run dev"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - .:/app
      - sentinel-node-modules-api:/app/node_modules

  worker:
    build: .
    depends_on:
      sentinel:
        condition: service_started
      postgres:
        condition: service_healthy
      demo-target:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      qa-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel?schema=public
      DEMO_TARGET_URL: http://demo-target
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: sentinel-minio
      MINIO_SECRET_KEY: sentinel-minio-development-only
      MINIO_BUCKET: sentinel-evidence
      MINIO_REGION: us-east-1
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      EMAIL_FROM: Sentinel <noreply@sentinel.local>
      SENTINEL_APP_URL: http://localhost:3001
      BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Sentinel Demo}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-ava.tester@example.test}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-sentinel-dev}
      JIRA_CLOUD_URL: ${JIRA_CLOUD_URL:-}
      JIRA_SERVICE_EMAIL: ${JIRA_SERVICE_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      QA_DATABASE_URL: postgresql://qa_diagnostic:qa-diagnostic-read-only-development-only@qa-postgres:5432/qa_fixture
      EVIDENCE_RETENTION_DAYS: "30"
      AUTO_RUN_DEMO_EMAIL: qa.tester@example.test
      AUTO_RUN_DEMO_PASSWORD: TestPassword!
      VARIABLE_ENCRYPTION_KEY: ${VARIABLE_ENCRYPTION_KEY:?Set VARIABLE_ENCRYPTION_KEY in an untracked .env file}
    command: sh -c "npm ci --ignore-scripts && npm run db:generate && npm run worker"
    volumes:
      - .:/app
      - sentinel-node-modules-worker:/app/node_modules

volumes:
  sentinel-postgres:
  sentinel-node-modules-api:
  sentinel-node-modules-worker:
  sentinel-minio:
  sentinel-redis:
  sentinel-qa-postgres:
